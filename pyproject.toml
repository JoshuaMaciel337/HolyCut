[project]
name = "holycut"
version = "0.1.0"
description = "HolyCut — IA que transforma cultos em Stories, Reels e cortes"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["apps/web", "brand/referencia"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["core", "api", "worker", "backup"]

[tool.ruff.lint.flake8-bugbear]
# Padrão do FastAPI: Depends() e Query() nos parâmetros são seguros
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
pythonpath = [".", "apps", "infra"]
testpaths = ["tests"]
markers = ["integracao: precisa de um MongoDB acessível"]
